
name: Extract ZIP into repository

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extract-zip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.OMID_SYNC_TOKEN }}

      - name: Extract source ZIP into repository root
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(
            find . -maxdepth 1 -type f -iname '*.zip' -print | sort
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No ZIP file found in the repository root."
            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Keep exactly one ZIP file in the repository root."
            printf 'Found: %s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[0]}"
          EXTRACT_DIR="$RUNNER_TEMP/source-zip"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          shopt -s dotglob nullglob
          TOP_LEVEL=("$EXTRACT_DIR"/*)
          SOURCE_DIR="$EXTRACT_DIR"

          if [ "${#TOP_LEVEL[@]}" -eq 1 ] && [ -d "${TOP_LEVEL[0]}" ]; then
            SOURCE_DIR="${TOP_LEVEL[0]}"
          fi

          if [ ! -f "$SOURCE_DIR/go.mod" ] || [ ! -d "$SOURCE_DIR/frontend" ]; then
            echo "ERROR: ZIP is not a valid 3X-UI source tree."
            echo "Expected go.mod and frontend/ at the source root."
            exit 1
          fi

          # Copy source files, including hidden files, without replacing
          # Git metadata or every workflow in this repository.
          for ITEM in "$SOURCE_DIR"/*; do
            [ -e "$ITEM" ] || [ -L "$ITEM" ] || continue

            NAME="$(basename "$ITEM")"

            case "$NAME" in
              .git|.github) continue ;;
            esac

            cp -a "$ITEM" .
          done

          # Update only the explicitly maintained workflows.
          if [ -d "$SOURCE_DIR/.github/workflows" ]; then
            mkdir -p .github/workflows

            for WORKFLOW in build-publish-image.yml extract-zip-to-root.yml; do
              if [ -f "$SOURCE_DIR/.github/workflows/$WORKFLOW" ]; then
                cp -f \
                  "$SOURCE_DIR/.github/workflows/$WORKFLOW" \
                  ".github/workflows/$WORKFLOW"
              fi
            done
          fi

          rm -f "$ZIP_FILE"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract 3X-UI source ZIP into repository root"

          git push origin "HEAD:${GITHUB_REF_NAME}"
